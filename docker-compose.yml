x-backend: &backend
  build: ./backend
  restart: on-failure
  environment: &env
    POSTGRES_HOST: db
    REDIS_URL: redis://redis:6379/0
    EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
    EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
    EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
    TWILIO_SID: ${TWILIO_SID:-}
    TWILIO_TOKEN: ${TWILIO_TOKEN:-}
    TWILIO_FROM: ${TWILIO_FROM:-}
  volumes: ["./backend:/app"]
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_started}
services:
  db:
    image: postgres:16
    environment: {POSTGRES_DB: flood, POSTGRES_USER: flood, POSTGRES_PASSWORD: flood}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flood -d flood"]
      interval: 3s
      retries: 20
  redis:
    image: redis:7
  api:
    <<: *backend
    command: sh -c "python manage.py makemigrations flood && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports: ["8000:8000"]
  worker:
    <<: *backend
    command: celery -A config worker -l info
  beat:
    <<: *backend
    command: celery -A config beat -l info
  frontend:
    image: node:20
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev -- --host"
    ports: ["5173:5173"]
volumes: {pgdata: {}}
